# log4j-api の簡易ロガーの設定 (エラーだけを標準エラーに出す)
org.apache.logging.log4j.simplelog.level=ERROR
org.apache.logging.log4j.simplelog.logFile=system.err
org.apache.logging.log4j.simplelog.showdatetime=false
# 外部参照のパスが URI として読めないときの POI のメッセージ (ダミーの URI で読み込みは続く。参照先は使わない) を出さない
org.apache.logging.log4j.simplelog.org.apache.poi.openxml4j.opc.PackageRelationshipCollection.level=OFF
